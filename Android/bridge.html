<script>
(() => {
  const callbacks = new Map();
  let nextId = 0;
  const call = (method, ...args) => new Promise((resolve, reject) => {
    const id = ++nextId;
    callbacks.set(id, {resolve, reject});
    AndroidBluetooth[method](id, ...args);
  });
  window.serialResult = (id, error) => {
    const pending = callbacks.get(id);
    callbacks.delete(id);
    if (!pending) return;
    if (error) pending.reject(new Error(error));
    else pending.resolve();
  };
  const serial = new EventTarget();
  const port = {
    open: () => call('connect'),
    close: () => call('disconnect'),
    writable: {
      getWriter: () => ({
        write: bytes => {
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);
          return call('send', btoa(binary));
        },
        releaseLock() {}
      })
    }
  };
  serial.requestPort = async () => {
    await call('pickDevice');
    return port;
  };
  window.serialDisconnected = () => {
    const event = new Event('disconnect');
    Object.defineProperty(event, 'target', {value: port});
    serial.dispatchEvent(event);
  };
  Object.defineProperty(navigator, 'serial', {value: serial});
  if (!crypto.randomUUID) crypto.randomUUID = () =>
    Array.from(crypto.getRandomValues(new Uint8Array(16)), value => value.toString(16).padStart(2,'0')).join('');
})();
</script>
